version: '3.8'

services:
  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MCP Server
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "mcp-server/dist/index.js"]
    environment:
      - NODE_ENV=production
    volumes:
      - ./mcp-server/logs:/app/mcp-server/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('MCP Server health check')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mastra Agent
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "agent/dist/index.js"]
    environment:
      - NODE_ENV=production
      - MCP_SERVER_URL=http://mcp-server:3001
    volumes:
      - ./agent/logs:/app/agent/logs
    depends_on:
      - mcp-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Agent health check')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: nosana-agents-network
